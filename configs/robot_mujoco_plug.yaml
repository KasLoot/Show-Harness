# Same planner -> single VLM action -> physics -> observation workflow as pick/place.
defaults:
  - robot_mujoco.yaml
scene: plug_insert
task: Securely grasp the orange-handled plug on the gray stand, lift it upward by 50 mm (5 cm) before lateral transport with its pin clear of the tall blue socket, and insert its silver cylindrical pin fully into the black bore, then release it and retreat with open fingers until the TCP is more than {retreat_clearance_mm} mm above the plug's top (aim for {retreat_target_mm} mm), leaving the plug seated and undisturbed.
max_steps: 200
log_dir: rollouts/mujoco_plug
visual_history_steps: 1 # Previous RGB views + metric depth text + executed action and measured effect; 0 disables.
wrist_depth: {representation: text, grid_rows: 32, grid_cols: 32, near_m: 0.0, far_m: 0.30}
plug_success: {retreat_clearance_m: 0.05}
fine_step_m: 0.002 # Legacy unsuffixed MV_* commands remain available at this distance.
cartesian_motion:
  translation_steps_m: {small: 0.002, medium: 0.01, large: 0.05}
  rotation_steps_deg: {small: 2, medium: 10, large: 30}
v0:
  max_subgoal_steps: 70
  controller_prompt_log_every: 1 # Audit every current/history image pair and action.
cartesian_observation_context: |
  Four simultaneous RGB images: A is Wrist, B is Front, C is Right Side, D is Angled Wrist.
  These CURRENT images come first with their matching WRIST_DEPTH_MM text array and
  calibration. Older image sets, when provided, are labeled HISTORY step N, oldest to
  newest. Each includes the depth array and calibration from the SAME before-action
  observation, with the executed action and measured movement that followed it.
  Use them to compare the effects of
  previous corrections or stalls; CURRENT images govern action and completion decisions.
  A commanded movement is not proof of actual motion. Do not reuse old wrist pixel
  coordinates after camera movement or rotation. Front is on
  the +X side and Right Side is on the +Y side. Both external cameras are orthographic
  and tilted 30 degrees downward toward the table. Both wrist cameras are attached
  to the hand and rotate and tilt whenever it does. A / Wrist's EXACT image center is the grasp
  point (TCP). During GRASP/pre-grasp approach, center the handle on that point in
  BOTH image axes; being anywhere
  horizontally between widely open fingers is insufficient. A cropped or edge-only
  handle view cannot confirm alignment. A, B, and C must independently support
  a grasp; plausible Wrist alignment cannot overrule an external view's visible offset.
  D / Angled Wrist looks obliquely below the TCP to expose the silver pin and black
  bore rim. D's image center is NOT the grasp point or a centering target. D can add
  grasp evidence, but full handle visibility in D is not required.
  The WRIST_DEPTH_MM observation's depth_mm text array is point-sampled from A's camera
  with the same projection, normally 32 rows by 32 columns, ordered top to bottom and
  left to right. source_width_px/source_height_px give the RGB dimensions, and
  sample_y_px/sample_x_px map each array row/column to exact zero-based pixel indices in A.
  Each value represents one sampled pixel, not a tile average. Identify surfaces in
  A before comparing corresponding samples. Values are camera-axis distance in
  MILLIMETRES, rounded to 1 mm, not world Z or clearance from the TCP. Use the supplied
  range and camera-to-TCP calibration: the camera is behind the grasp point, and
  rotation changes its depth direction relative to world Z. null means invalid or
  outside the configured range, never proof of empty space. Depth represents only
  visible, sampled surfaces; this sparse grid may miss narrow edges or finger pads,
  and does not provide depth for every RGB pixel. Numbers alone cannot identify an
  object or establish its complete shape, pose, or contact. There is no fifth model
  image; grayscale images are local diagnostics only. Use the current
  measured image-right, image-down, and available sightline world vectors for each
  wrist camera in the controller prompt to select movements after rotation. Camera
  translation parallel to a wrist image plane makes a stationary target shift oppositely
  in that image. Motion along its sightline mainly changes apparent size. In Front, MV_FWD moves
  closer to the camera, MV_BACK farther away, MV_RIGHT image-right, and MV_LEFT
  image-left. Front's horizontal position isolates Y alignment. In Right Side, MV_FWD
  moves image-left, MV_BACK image-right, MV_RIGHT closer to the camera, and MV_LEFT
  farther away. Right Side's horizontal position isolates X alignment. MV_UP moves
  vertically upward, away from the table; MV_DOWN moves vertically downward, toward
  the table. Depth and height can overlap visually; cross-check both external views
  and the wrist views. Orthographic depth does not change apparent size. Use the external views
  to bring an object outside Wrist into view and to check height.
  The plug has a broad orange handle and a silver cylindrical pin, 20 mm in diameter.
  The blue socket has an open BLACK cylindrical bore, nominally 26 mm wide and 50 mm
  deep. Black identifies the bore interior; the opening is not filled by a solid cap.
  The pin and bore are round, so no keyed yaw alignment is required. Z rotations
  remain available but are not needed to fit; correct shaft tilt only when visibly needed.
  During GRASP/pre-grasp approach only, before lowering toward the handle or closing,
  compare the handle center horizontally with the midpoint
  of the inner black fingertip pads, not the hand body. In Front, a target left of
  that midpoint requires MV_LEFT, and right requires MV_RIGHT, checking Y alignment.
  In Right Side, a target left of the grasp-point/fingertip-pad midpoint column
  requires MV_FWD, and right requires MV_BACK, checking X alignment. A visible Side
  offset vetoes descent and GRASP even when Wrist looks plausible.
  Align XY at safe clearance, then approach handle height using SMALL steps near it,
  rechecking A, B, and C after each action. Close only when the actual fingertip pads
  straddle the handle body at contact height; merely above it or overlapping its
  silhouette is insufficient. Before closing, compare visible handle and fingertip-pad
  samples in WRIST_DEPTH_MM, using A's pixel mapping and A/B/C to identify surfaces
  and judge whether the pads reach around
  the handle body. A shallow fingertip touch or edge-only grip is insufficient; similar
  numerical depths alone do not prove contact, and different visible surfaces need
  not have identical values. The array supplements the A/B/C checks and cannot reveal
  hidden or unsampled surfaces. The handle is 32 mm tall: when upright with A looking straight down, its
  side-body center is 16 mm below the visible top face. At a body-center grasp, the
  top-face depth should be approximately 16 mm CLOSER to the camera than the supplied
  TCP-plane depth, not equal to it. Cross-check A/B/C and visible finger-pad depths;
  do not apply this shortcut with a tilted handle/wrist or an obscured top face.
  Reported height above the table is not clearance over
  the handle; images govern actual contact height. These pre-grasp centering checks
  do not apply to INSERT/PLACE, where the actual silver pin axis/tip must align with
  the BLACK bore rim, not the orange handle, blue housing center, or TCP.
  During grasp approach, these checks override generic rough-alignment,
  table-height, and oscillation-based descent hints. Uncertainty means no GRASP:
  make a SMALL correction when visually justified, otherwise STOP. Do not use DONE
  or new subgoals to escape an unresolved grasp. An empty close proves neither
  "too high" nor "overshot"; re-evaluate X, Y, and Z from fresh images.
  Nonzero gripper width alone does not establish a centered, secure grasp. Edge
  contact cannot satisfy grasp-stage DONE; visually verify secure contact around
  the handle body before completing grasp or starting lift/transport.
  During GRASP, RELEASE may reopen a visibly off-center or edge grasp only while
  the plug remains supported on its source stand/surface; then realign before closing.
  After a secure handle-body grasp, plan a separate LIFT milestone of 50 mm (5 cm)
  upward before any lateral transport toward the tall blue socket. The VLM must choose
  MV_UP_LARGE, exactly 50 mm in the default plug configuration, as one atomic action. Verify the
  completed lift from measured movement and fresh images; a commanded lift is not
  proof of completion. If motion is incomplete, inspect and finish the remaining
  lift with justified sized upward steps rather than repeating the full command.
  If command sizes were customized, their supplied amounts govern completing the same lift goal.
  LIFT DONE requires measured 50 mm upward movement from the secure-grasp pose, secure
  carry without handle slip, and the pin bottom visibly clear of the stand and the
  blue socket's top along the transport path. If necessary, raise safely to obtain
  clearance before lateral travel. A TCP rise without plug rise is not a successful
  lift. During transport or later stages, do not restart the completed post-grasp LIFT
  milestone because a stage or recovery begins. Use the current stage and available
  history to interpret progress; recovery requiring a new secure grasp requires a new
  lift. Later clearance corrections depend on current images. This is a VLM action
  milestone, not an automatic lift or a multi-action reply.
  For insertion, Front checks Y and Right Side checks X; D exposes the pin tip, rim,
  lateral offset, and tilt. Compare the pin centerline with the actual black opening;
  plausible D alignment cannot overrule visible offset in Front or Right Side. The
  bore has only about 3 mm radial clearance around the pin. In D, a hovering pin tip
  and the hole have different
  heights and oblique-view parallax, so do not demand coincident tip/hole pixels.
  Extrapolate the pin axis to the rim plane and center it in the opening, with clearance
  around the full pin outline; cross-check the external views. Partial silhouette
  overlap is not a fit. Near entry, a pin edge clipping one rim side while the bore
  stays visible on the other is possible misalignment. Inspect this asymmetry using
  the rim plane and orthogonal views; oblique perspective does not require equal
  projected pixel gaps. If uncertainty is comparable to the 3 mm radial clearance,
  restore an inspectable view and refine alignment before descent or DONE.
  A transport/alignment stage is complete only when CURRENT
  views support this pin-axis/rim check, not rough alignment with the blue housing.
  Starting a new stage or a previous DONE is not alignment proof. At final approach
  and before each downward step, recheck D plus Front and Right Side.
  Before entry, visible lateral offset or an unlocalized rim vetoes MV_DOWN and DONE
  for transport/alignment or insertion. With the tip above and clear of the rim, make
  a justified SMALL lateral correction. If the hand or pin hides the rim, take a safe
  SMALL upward clearance move to inspect, then realign. Earlier visible rim positions
  may help against CURRENT fixed-camera landmarks, but cannot overrule current offset
  or replace the final check. STOP only when neither correction nor clearance movement
  is justified; do not repeat STOP despite a safe way to inspect.
  Use SMALL translations and tilt corrections near contact, inspecting after each.
  Once entry is visibly established, rim occlusion is expected. Use CURRENT external
  views, measured pose, and actual motion to judge depth; occlusion alone does not
  require repeated withdrawal. Commanded descent or silhouette overlap proves neither
  entry nor seating. If insertion stalls, lateral offset appears, or contact blocks
  motion, lift clear before lateral correction; do not slide against the rim, keep
  pushing, or rotate inside the bore. Compare HISTORY and CURRENT pin-tip/rim positions
  and handle/fingertip-pad positions. Measured TCP descent does not prove plug descent.
  A pin stationary on the rim while the hand lowers, or a handle sliding upward between
  the fingers, means blockage/slippage: stop descent, lift for clearance when safe,
  verify or re-establish secure handle contact, and realign. Do not respond with more
  downward steps or declare insertion from hand motion. Hovering or resting on the rim
  is not insertion. At the socket, release only after the pin is seated at insertion
  depth and the plug is supported by the socket. Confirm visible seating before RELEASE,
  using external depth/seating cues when the rim is occluded; a pin tip still above
  the rim is hovering. Do not
  release expecting gravity to finish insertion.
  Plan a distinct final RETREAT stage after seated release: withdraw the OPEN, empty
  hand, not the plug. This is separate from the initial post-grasp LIFT. First choose
  one MV_UP_LARGE (50 mm by default), then reobserve. RETREAT completion must explicitly
  require open fingers, an undisturbed seated plug, and the TCP strictly MORE THAN
  {retreat_clearance_mm} mm vertically above the visible top of the orange handle;
  aim for about {retreat_target_mm} mm for margin, as specified by the completion-clearance
  block. A vague "clear gap" is insufficient, and 50 mm of commanded travel alone
  cannot establish the gap because the starting TCP may be below the handle top.
  If clearance is short, select an appropriate upward step, then inspect before DONE.
  Estimate the plug top from CURRENT images and mapped depth samples, not assumed
  object coordinates. With a straight-down Wrist, sampled top-face depth minus the
  calibrated camera-to-TCP depth estimates the vertical TCP-to-top gap. Cross-check
  Front/Side and the visible 32 mm-tall handle as a scale cue. Do not treat that
  subtraction as world height with a tilted wrist or a hidden/unsampled top; use
  the current camera basis and views. TCP movement alone does not prove undisturbed
  seating. These explicit retreat checks override vague withdrawal goals; the initial
  completed LIFT does not satisfy final RETREAT.
  For insertion MV_DOWN or transport/alignment DONE, the one-sentence reasoning must
  cite CURRENT pin/rim X alignment in Right Side and Y alignment in Front, cross-checked
  with D. Distinguish observed plug motion from TCP motion; unsupported alignment calls
  for correction or inspection instead.
  Plan separate visual milestones for grasp, the explicit measured 50 mm lift with
  transport clearance, transport/alignment, insertion, release,
  and final RETREAT with its explicit TCP-to-plug-top clearance and undisturbed seating.
  DONE completes only the current stage when its visible goal is met.
