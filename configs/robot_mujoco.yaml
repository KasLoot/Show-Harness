# RoboLab RubiksCubeTask + original Show-Harness zero-shot harness.
# Hardware/site identity is replaced by the MuJoCo session; the policy is reused.
harness_config: configs/robot_franka.yaml
camera_config: configs/robot_robolab.yaml
task_class: RubiksCubeTask
task_source: models/mujoco/robolab/robolab/tasks/benchmark/rubiks_cube_task.py
asset_dir: models/mujoco/rubiks_cube_bowl
hardware: franka
max_steps: 150
log_dir: rollouts/mujoco_robolab
physics_timestep_s: 0.002
control_tick_s: 0.04  # legacy fixed-tick mode, when motion_control.enabled is false
initial_settle_s: 2.0
cube_size_m: 0.04  # uniform mesh scaling; null restores the authored ~58 mm cube
# Cube mass remains the source 0.2 kg.
gripper_duration_s: 1.0
evaluation_settle_s: 2.0
workspace_min: [0.15, -0.40, 0.135]
workspace_max: [0.80, 0.40, 0.70]
# EE frame is panda_hand, matching the original RoboLab robot and the measured
# 132.3 mm flange-to-tip reach, rather than the old prototype's tip-centered TCP.
z_floor_m: 0.135
enable_z_floor: true
gripper_color: yellow
smooth_dt_s: 0.0   # inherited smooth plugin is disabled; MuJoCo owns movement timing
gui_speed: 1.0     # pace live GUI motion; headless runs advance as fast as possible
motion_control:
  enabled: true
  linear_speed_m_s: 0.10
  angular_speed_rad_s: 0.5
  joint_speed_rad_s: 1.0
  min_duration_s: 0.25
  position_tolerance_m: 0.0002
  rotation_tolerance_rad: 0.005
  velocity_tolerance_rad_s: 0.02
  settle_duration_s: 0.1
  settle_timeout_s: 3.0
  integral_gain_s: 2.0
gripper_control:
  enabled: true
  close_force_n: 80.0  # actual force target/limit per finger, not just a higher unused cap
  open_force_n: 40.0
  kp: 6000.0
  kd: 100.0
  speed_m_s: 0.04
  velocity_tolerance_m_s: 0.003
  width_tolerance_m: 0.0002
  timeout_s: 4.0
recording:
  enabled: true
  fps: 30
  layout: front   # multiview adds wrist/side panels; it takes longer to render
robot:
  settle_steps: 1  # MuJoCo's blocking trajectory controller now handles convergence
  settle_dt_s: 0.0
  gripper_settle_s: 0.0   # the simulated gripper call advances physics synchronously
  gripper_min_settle_s: 0.0
plugins:
  # All other policy plugins inherit configs/robot_franka.yaml.
  dagger: false
  smooth: false  # smooth references are generated by the MuJoCo motion controller
  coords: false
  affordance: false
  video_ref: false
vlm_backend: gemini
vlm_backends:
  gemini:
    provider: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    reasoning_cot: true
    reasoning_effort: medium
    max_tokens: 2048
    max_retries: 2
v0:
  video_fps: 5
  controller_prompt_log_every: 1
